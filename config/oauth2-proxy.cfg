# ============================================================
# OAuth2 Proxy 配置文件
#
# 作用：处理 Azure AD MFA 认证
# 使用场景：Squid MFA 认证模式（3129 端口）
#
# 认证流程：
#   1. 用户访问 http://<proxy>:3129/login
#   2. OAuth2 Proxy 重定向到 Azure AD 登录页面
#   3. 用户输入账号密码，完成 MFA 验证
#   4. OAuth2 Proxy 设置 Cookie（_oauth2_proxy）
#   5. 用户访问任何网站 → Squid 验证 Cookie → 允许访问
#
# 依赖：
#   - Azure AD 应用注册（必须配置重定向 URI）
#   - OAuth2 Proxy Docker 镜像（quay.io/oauth2-proxy/oauth2-proxy）
#
# 版本：v1.0（MFA 认证支持）
# ============================================================

# ============================================
# 提供程序配置（Azure AD）
# ============================================
provider = "azure"

# Azure AD 租户 ID
# 从 .env 文件读取：AAD_TENANT_ID
azure_tenant_id = "${AAD_TENANT_ID}"

# ============================================
# OAuth2 客户端配置
# ============================================
# Azure AD 应用 ID
# 从 .env 文件读取：AAD_CLIENT_ID
client_id = "${AAD_CLIENT_ID}"

# Azure AD 应用密钥
# 从 .env 文件读取：AAD_CLIENT_SECRET
client_secret = "${AAD_CLIENT_SECRET}"

# ============================================
# Cookie 配置
# ============================================
# Cookie 加密密钥（必须 43+ 字符）
# 从 .env 文件读取：OAUTH2_PROXY_COOKIE_SECRET
cookie_secret = "${OAUTH2_PROXY_COOKIE_SECRET}"

# Cookie 名称
cookie_name = "_oauth2_proxy"

# Cookie 域名（必须与代理域名一致）
# 从 .env 文件读取：PROXY_HOSTNAME
cookie_domain = "${PROXY_HOSTNAME}"

# Cookie 有效期（24 小时）
cookie_expire = "24h"

# Cookie 安全标志（HTTPS  Only）
cookie_secure = false

# Cookie HTTP Only 标志（防止 XSS）
cookie_http_only = true

# ============================================
# 回调 URL 配置
# ============================================
# 登录成功后重定向到此处
# 格式：https://<proxy-hostname>/oauth2/callback
# 从 .env 文件读取：PROXY_HOSTNAME
redirect_url = "https://${PROXY_HOSTNAME}:3129/oauth2/callback"

# ============================================
# 监听配置
# ============================================
# 监听地址（容器内）
http_address = "0.0.0.0:4180"

# ============================================
# 认证配置
# ============================================
# 跳过证书验证（测试环境）
insecure_oidc_allow_unverified_email = true

# 认证通过后，显示用户信息
show_debug_on_error = true

# 会话有效期（24 小时）
session_expiration = "24h"

# ============================================
# 上游服务配置
# ============================================
# 上游 Squid 代理地址（可选，用于反向代理模式）
# upstream = "http://squid:3128"

# ============================================
# 日志配置
# ============================================
# 日志级别
logging_level = "info"

# 标准输出日志（Docker 日志可见）
standard_logging = true

# ============================================
# 其他配置
# ============================================
# 允许的所有邮箱（留空 = 允许所有）
# allowed_emails = ["*@envision-energy.com"]

# 允许的所有域名（留空 = 允许所有）
# allowed_domains = ["envision-energy.com"]

# 跳过登录页面（直接跳转到 Azure AD）
skip_provider_button = true

# 自定义登录页面（可选）
# custom_login_logo = "/etc/oauth2-proxy/logo.png"

# 跳过非关键错误
skip_auth_strip_headers = true