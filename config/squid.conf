# ============================================================
# Squid 代理配置 - Azure AD ROPC + MFA 双模式认证
#
# 项目：Squid + Azure AD 正向代理网关
# 版本：v11（支持 ROPC 和 MFA 双模式认证）
# 监听端口：
#   3128 - HTTPS 代理（ROPC 认证，Basic Auth，向后兼容）
#   3129 - HTTPS 代理（MFA 认证，OAuth2 Proxy + Cookie）
#
# 依赖：Squid 7.6（源码编译，--with-openssl）
# 认证模式：
#   - 模式 1（ROPC）：适合脚本、非浏览器应用
#   - 模式 2（MFA）：适合浏览器用户，支持 Azure AD MFA
#
# 使用场景：
#   - 自动化脚本、curl 请求 → 使用 3128 端口 + ROPC
#   - 浏览器访问 → 使用 3129 端口 + MFA
# ============================================================

# ============================================
# 多进程配置（利用多核 CPU）
# ============================================
workers 4                    # 启用 4 个 worker 进程（适配 4 核 CPU）
max_filedescriptors 65536    # 最大文件描述符（支持高并发连接）

# ============================================
# 用户权限（Squid 不能以 root 运行）
# ============================================
cache_effective_user proxy    # Squid 运行用户（必须是非 root）
cache_effective_group proxy   # Squid 运行组

# ============================================
# HTTPS 代理端口（ROPC 认证 - Basic Auth）
#   cert : TLS 证书（由 entrypoint.sh 从环境变量替换 __DOMAIN__ 占位符）
#   key  : 私钥（由 entrypoint.sh 从环境变量替换 __DOMAIN__ 占位符）
#   tls-options : 禁用不安全的 SSLv3 和 TLSv1
#   name : 端口别名（用于日志标识）
# ============================================
https_port 3128 cert=/etc/squid/certs/__DOMAIN__.crt key=/etc/squid/certs/__DOMAIN__.key tls-options=NO_SSLv3,NO_TLSv1 name=https_proxy_ro

# ============================================
# HTTPS 代理端口（MFA 认证 - OAuth2 Proxy Cookie）
#   用户需要先访问 http://<proxy>:3129/login 完成 MFA 登录
#   然后浏览器会自动携带 Cookie，Squid 验证 Cookie 有效性
# ============================================
https_port 3129 cert=/etc/squid/certs/__DOMAIN__.crt key=/etc/squid/certs/__DOMAIN__.key tls-options=NO_SSLv3,NO_TLSv1 name=https_proxy_mfa

# PID 文件（Squid 主进程 PID 存放位置）
pid_filename /data/run/squid.pid

# ============================================
# Azure AD ROPC 认证配置（Basic Auth）- 用于 3128 端口
# ============================================
# 认证脚本路径（指向 /tmp 下的副本，由 entrypoint.sh 处理）
auth_param basic program /tmp/squid_aad_auth.sh
# 认证子进程数（100 个，支持高并发认证）
#   children : 最大并发认证进程数
#   startup  : 启动时预启动进程数（避免冷启动延迟）
#   idle     : 空闲时保留的最小进程数（应对突发请求）
auth_param basic children 100 startup=10 idle=10
# 认证缓存时间（1 小时，期间同源用户不再调 AAD）
# 注意：此外还有本地文件缓存（/data/log/auth_cache），TTL 1 小时
auth_param basic credentialsttl 1 hour
# 认证提示信息（浏览器弹窗显示）
auth_param basic realm "Envision Proxy - AAD Login (ROPC)"
# 用户名是否区分大小写（off = 不区分）
auth_param basic casesensitive off

# 认证 ACL（proxy_auth REQUIRED = 所有请求必须认证）
acl authenticated proxy_auth REQUIRED

# ============================================
# Azure AD MFA 认证配置（Cookie 验证）- 用于 3129 端口
# ============================================
# Cookie 验证脚本（调用 OAuth2 Proxy API 验证 Cookie）
#   ttl : 缓存时间（5 分钟，减少 OAuth2 Proxy 调用）
#   children : 最大并发验证进程数
#   grace : 过期后允许继续使用的时间（避免长时间阻塞）
external_acl_type oauth_mfa ttl=300 children=50 startup=5 idle=5 grace=60 %LOGIN /tmp/squid_oauth_validate.sh

# MFA 认证 ACL（验证 Cookie 有效性）
acl mfa_authenticated external oauth_mfa

# 端口 ACL（区分 3128 和 3129）
acl port_ropc localport 3128
acl port_mfa localport 3129

# ============================================
# 访问控制列表（ACL）
# ============================================
acl localnet src all                                    # 允许所有来源 IP（生产环境应限制）
acl SSL_ports port 443 563                             # 允许的 SSL 端口
acl Safe_ports port 80 21 443 563 70 210 280 488 591 777 1025-65535  # 允许的端口
acl CONNECT method CONNECT                              # CONNECT 方法（HTTPS 隧道）

# ============================================
# 访问规则（从上到下匹配，第一条匹配即生效）
# ============================================
http_access deny !Safe_ports                          # 拒绝访问非安全端口
http_access deny CONNECT !SSL_ports                  # 拒绝 CONNECT 到非 SSL 端口

# 模式 1：ROPC 认证（3128 端口）
#   使用 Basic Auth，适合脚本、非浏览器应用
http_access allow port_ropc authenticated localnet

# 模式 2：MFA 认证（3129 端口）
#   使用 OAuth2 Proxy Cookie，适合浏览器用户
#   未认证用户访问 → 返回自定义错误页面（302 重定向到登录页面）
http_access allow port_mfa mfa_authenticated localnet

# 拒绝所有其他请求（默认拒绝）
http_access deny all

# ============================================
# 自定义错误页面（MFA 认证失败 → 重定向到登录页面）
# ============================================
# 当用户访问 3129 端口但未携带有效 Cookie 时
# 返回 302 重定向到 OAuth2 Proxy 登录页面
deny_info 302:https://%h/login mfa_authenticated !mfa_authenticated
# 注意：上面的配置可能不生效（Squid deny_info 不支持 302 重定向）
# 更可靠的方案：使用外部脚本返回自定义响应
# 参见：scripts/squid_oauth_redirect.sh

# ============================================
# 缓存配置（禁用磁盘缓存，只使用内存缓存）
# ============================================
cache_mem 512 MB                                     # 内存缓存大小
maximum_object_size_in_memory 1 MB                   # 内存中最大对象大小
maximum_object_size 0 KB                            # 禁用磁盘缓存（0 = 不缓存到磁盘）

# ============================================
# DNS 配置（使用公网 DNS 服务器）
# ============================================
dns_nameservers 8.8.8.8 114.114.114.114         # 公网 DNS（可解析公网域名）

# ============================================
# 超时设置
# ============================================
connect_timeout 30 seconds                           # 连接上游服务器超时
request_timeout 5 minutes                           # 请求超时（等待客户端发送完整请求）
read_timeout 15 minutes                            # 读取上游服务器响应超时
client_lifetime 24 hours                           # 客户端连接最长存活时间
half_closed_clients off                            # 禁用半关闭连接（立即关闭）
pconn_timeout 120 seconds                          # 持久连接超时

# ============================================
# 性能优化
# ============================================
server_persistent_connections on                    # 启用与上游服务器的持久连接
client_persistent_connections on                   # 启用与客户端的持久连接
tcp_recv_bufsize 64 KB                            # TCP 接收缓冲区大小

# ============================================
# 日志配置
# ============================================
# access_log : 访问日志（stdio = 输出到 stdout，docker logs 可见）
access_log stdio:/tmp/access.log squid
# cache_log : 缓存日志（Squid 运行日志，包含认证脚本输出）
cache_log /data/log/cache.log
logfile_rotate 7                                   # 日志保留 7 天
debug_options ALL,1                                 # 调试级别（1 = 只记录关键信息）

# ============================================
# 域名/IP 显示名（由 entrypoint.sh 从环境变量替换）
# ============================================
visible_hostname __PROXY_HOSTNAME__                 # 代理服务器主机名（替换变量）
cache_mgr admin@localhost                         # 管理员邮箱（日志中显示）
shutdown_lifetime 3 seconds                       # Squid 关闭前等待时间

# 隐私保护（不泄露代理服务器信息）
via off                                             # 不在响应头中添加 Via 字段
forwarded_for delete                                # 删除 X-Forwarded-For 头

# ============================================
# 缓存刷新策略（针对静态资源）
# ============================================
refresh_pattern ^ftp:           1440    20%     10080
refresh_pattern ^gopher:        1440    0%      1440
refresh_pattern -i (/cgi-bin/|\?) 0     0%      0
refresh_pattern .               0       40%     4320
# 静态资源缓存策略（虽然 disk cache 禁用，但仍影响内存缓存）
refresh_pattern -i \.(jpg|jpeg|png|gif|ico|svg|webp)$ 10080 90% 525600
refresh_pattern -i \.(css|js)$                                    10080 90% 525600
refresh_pattern -i \.(woff|woff2|ttf|eot|otf)$                    525600 99% 525600
refresh_pattern -i \.(pdf|doc|docx|xls|xlsx|ppt|pptx)$     1440 80% 10080
